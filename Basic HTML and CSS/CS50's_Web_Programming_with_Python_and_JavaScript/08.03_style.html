<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Style</title>
    <style>
      #main {
        font-size: xx-large;
        color: violet;
        border: 2px solid black;
        padding: 8px;
      }
      #sub {
        font-size: large;
        color: rgb(235, 157, 235);
        border: 2px solid black;
        padding: 8px;
      }

      div {
        text-align: center;
      }

      table {
        border: 2px solid brown;
        justify-self: center;
        font-size: larger;
        border-radius: 5%;
      }

      th {
        color: blue;
        font-weight: bold;
      }

      td {
        color: rgb(162, 162, 239);
        border-right: 2px solid gray;
        border-bottom: 2px solid gray;
      }
    </style>
  </head>
  <body>
    <h1 id="main">This is the core heading</h1>
    <h1 id="sub">This is another core heading</h1>
    <div>Two sub Heading:</div>

    <h3 id="main">Sub Heading 1</h3>
    <h3 id="sub">Sub Heading 2</h3>

    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Major</th>
          <th>Aggregate</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Anwar</td>
          <td>Computer Science</td>
          <td>78.8</td>
        </tr>
        <tr>
          <td>Khan</td>
          <td>Social Science</td>
          <td>79.5</td>
        </tr>
        <tr>
          <td>Jaan</td>
          <td>Civil Engineering</td>
          <td>81.4</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
